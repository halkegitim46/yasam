# ======================================================================
# SÜRÜM KATALOĞU — AŞAMA B: AGP 9 + Kotlin 2.4 + Android 36 hedefi
# Uyumluluk kuralları (CI'da preflight → "Sürüm uyumluluğu" ile derlemeden ÖNCE denetlenir):
#  1) AGP 9.x yerleşik Kotlin getirir: 'org.jetbrains.kotlin.android' eklentisi KULLANILMAZ (kaldırıldı).
#  2) Kotlin 2.4.x: AGP >= 9.1 ve Hilt >= 2.60 ister. Hilt >= 2.59 yalnızca AGP 9+ ile çalışır.
#  3) AGP 9.5: Gradle >= 9.6 (bu projede 9.7.1: Kotlin Gradle eklentisinin test ettiği en yeni Gradle ile AGP'nin alt sınırının kesişimi).
#  4) KSP 2.3.x Kotlin'den bağımsızdır; KSP >= 2.3.12 için AGP >= 8.12.
#  5) Compose 1.12+ (BOM 2026.09+): compileSdk 37 ve AGP 9 ister. BOM 2026.11.01 (Compose 1.13, Material3 1.5) compileSdk 37.1 ister.
#  6) targetSdk 36 (Android 16), compileSdk 37 (AGP 9.5'in desteklediği en yüksek API).
# Geri dönüş (Aşama A, CI'da doğrulanacak ara küme): agp 8.13.2, kotlin 2.2.21, ksp 2.3.14, hilt 2.58, room 2.8.4, Gradle 8.13.
# Son CI'da kanıtlı eski küme: agp 8.7.3, kotlin 2.0.21, ksp 2.0.21-1.0.28, hilt 2.52, room 2.6.1, Gradle 8.9.
# Ayrıntı: docs/UYUMLULUK.md
# ======================================================================
[versions]
agp = "9.5.2"
kotlin = "2.4.21"
ksp = "2.3.14"
composeBom = "2026.09.00"
hilt = "2.60.1"
hiltAndroidx = "1.3.0"
room = "2.8.5"
navigation = "2.10.2"
work = "2.12.0"
datastore = "1.3.0"
biometric = "1.1.0"
coreKtx = "1.19.1"
lifecycle = "2.11.1"
activityCompose = "1.13.0"
coroutines = "1.11.0"
fragment = "1.9.1"
junit = "4.13.2"
robolectric = "4.17"
sqlcipher = "4.6.1"
androidxTestExtJunit = "1.2.1"
androidxTestRunner = "1.6.2"
androidxTest = "1.6.1"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons = { module = "androidx.compose.material:material-icons-extended" }
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
hilt-lifecycle-viewmodel-compose = { module = "androidx.hilt:hilt-lifecycle-viewmodel-compose", version.ref = "hiltAndroidx" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
datastore = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }
androidx-fragment = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core-ktx", version.ref = "androidxTest" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
