name: Proje dosyalarını tamamla (Gradle wrapper + Room şemaları)

# Gerektiğinde elle çalıştırın: Gradle wrapper dosyalarını ve Room şema dosyalarını (app/schemas) depoya işler.
# Böylece derleme yerelde ve CI'da aynı Gradle sürümüyle yapılır, şema değişiklikleri/migration'lar denetlenebilir.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-android-build

      - name: Gradle Wrapper doğrula
        uses: gradle/actions/wrapper-validation@v5

      - name: Derle (Room şemalarını dışa aktarır)
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Depoya işle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper app/schemas
          if git diff --cached --quiet; then
            echo "Eklenecek değişiklik yok."
          else
            git commit -m "chore: Gradle wrapper ve Room şemaları eklendi"
            git push
          fi
